services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waterline
      POSTGRES_USER: waterline
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - development-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waterline -d waterline']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  development-data:
